<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotización - ReyRey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html">Inicio</a>
  </header>

  <main>
    <section id="acceso">
      <h2>Acceso a cotización</h2>
      <input type="password" id="code" placeholder="Código">
      <button id="codeBtn">Ingresar</button>
      <p id="codeError" class="error"></p>
    </section>

    <section id="cotizador" style="display:none;">
      <h2>Selecciona opciones</h2>
      <form id="quote-form">
        <label><input type="checkbox" value="450000"> Renovación de cocina</label><br>
        <label><input type="checkbox" value="300000"> Home office</label><br>
        <label><input type="checkbox" value="200000"> Walking closet</label><br>
        <label><input type="checkbox" value="150000"> Quincho</label><br>
        <p>Total: $<span id="total">0</span></p>
      </form>
    </section>
  </main>

  <script src="quote.js"></script>
</body>
</html>
