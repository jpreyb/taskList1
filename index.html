<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReyRey Estudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"><img src="logo.svg" alt="ReyRey"></div>
    <nav>
      <a href="#galeria">Proyectos</a>
      <a href="#contacto">Contacto</a>
      <a href="quote.html">Cotización</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Renovamos tus espacios con estilo</h1>
    <p>Desde Temuco para todo Chile</p>
  </section>

  <section id="galeria" class="gallery">
    <h2>Proyectos</h2>
    <div class="grid">
      <img src="https://via.placeholder.com/300x200" alt="Proyecto 1">
      <img src="https://via.placeholder.com/300x200" alt="Proyecto 2">
      <img src="https://via.placeholder.com/300x200" alt="Proyecto 3">
    </div>
  </section>

  <section id="contacto" class="contact">
    <h2>Contacto</h2>
    <form id="contact-form" action="mailto:contacto@reyrey.cl" method="POST" enctype="text/plain">
      <input type="text" name="nombre" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Correo" required>
      <textarea name="mensaje" placeholder="Mensaje"></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer>
    © 2024 ReyRey Estudio
  </footer>
</body>
</html>
